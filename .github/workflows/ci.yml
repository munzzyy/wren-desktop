name: CI
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Wren branding
        run: python3 tools/rebrand.py --check

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          apt-packages: xvfb libpulse0

      - name: Run generate
        run: pnpm run generate

      - name: Check TypeScript
        run: pnpm run check:types

      - name: Check prettier
        run: pnpm run lint-prettier --cache-location=~/.cache/prettier

      - name: Check Oxlint
        run: pnpm run oxlint:ci

      - name: Lint intl
        run: pnpm run lint-intl

      - name: Run node tests
        run: xvfb-run --auto-servernum pnpm run test-node

      - name: Allow the Electron sandbox on Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Create preload cache
        run: xvfb-run --auto-servernum pnpm run build:preload-cache
        env:
          ARTIFACTS_DIR: artifacts/linux

      - name: Run electron tests
        run: xvfb-run --auto-servernum pnpm run test-electron
        timeout-minutes: 15
        env:
          ARTIFACTS_DIR: artifacts/linux
          LANG: en_US
          LANGUAGE: en_US
          WORKER_COUNT: 4

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-logs
          path: artifacts
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run generate
        run: pnpm run generate

      - name: Run node tests
        run: pnpm run test-node

  macos:
    name: macOS
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Run generate
        run: pnpm run generate

      - name: Check TypeScript
        run: pnpm run check:types
